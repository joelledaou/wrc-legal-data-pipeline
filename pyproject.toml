[project]
name = "wrc-legal-data-pipeline"
version = "0.1.0"
description = "Scrapy pipeline for scraping decisions and determinations from workplacerelations.ie"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.13",
    "pymongo>=4.6",
    "minio>=7.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "dagster>=1.8",
    "dagster-webserver>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
