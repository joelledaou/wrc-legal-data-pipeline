services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Dagster UI + daemon: orchestrates ingestion -> transformation.
  dagster:
    build: .
    command: dagster dev -m wrc_pipeline.orchestration -h 0.0.0.0 -p 3000
    env_file: .env
    environment:
      DAGSTER_HOME: /opt/dagster_home
    ports:
      - "3000:3000"
    volumes:
      - dagster-home:/opt/dagster_home
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

  # One-off CLI runs, e.g.:
  #   docker compose run --rm pipeline python -m wrc_pipeline.ingest --start-date 2024-01-01 --end-date 2024-02-01
  pipeline:
    build: .
    profiles: ["cli"]
    env_file: .env
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  mongo-data:
  minio-data:
  dagster-home:
